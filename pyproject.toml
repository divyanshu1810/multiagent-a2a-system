[project]
name = "multi-agent-a2a-ecosystem"
version = "0.1.0"
description = "Multi-Agent A2A Ecosystem with MCP, LangGraph, Agno, and Google ADK"
requires-python = ">=3.11"
dependencies = [
    # MCP
    "fastmcp>=2.2.0",
    "mcp>=1.3.0",
    # LangChain + Cohere
    "langchain>=0.3.0",
    "langchain-cohere>=0.3.4",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langgraph>=0.2.55",
    # Vector store & PDF
    "chromadb>=0.5.23",
    "pypdf>=4.3.1",
    # Cohere SDK
    "cohere>=5.11.0",
    # Agno (Remote Agent 2 workflow)
    "agno>=1.4.4",
    # Google ADK (Host Agent)
    "google-adk>=0.5.0",
    # API / serving
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Gradio UI
    "gradio>=4.44.0",
    # Data
    "pandas>=2.2.0",
    # Web search fallback
    "duckduckgo-search>=6.3.7",
    "tavily-python>=0.3.9",
    # Utils
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "tenacity>=8.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "common",
    "mcp_server_1",
    "mcp_server_2",
    "mcp_server_3",
    "remote_agent_1",
    "remote_agent_2",
    "host_agent",
]
